name: tok
tagline: Count tokens. Gate pipelines before they fail.
meta_description: "vrk tok counts the tokens in text (o200k_base by default). Use --check N to stop a pipeline when the input is over your context budget."
description: |
  `vrk tok` counts tokens and gates pipelines in about 25 ms. It counts with o200k_base by default, the tokenizer of GPT-4o, GPT-4.1, GPT-5, and the o-series. `--model gpt-4` or `gpt-3.5-turbo` switches to cl100k_base. The count is exact for OpenAI models and an estimate for Claude. Without `--check`, tok prints the count. With `--check N`, tok passes the input through if it is within the budget. If the input is over the budget, tok exits 1 with empty stdout, so the pipeline stops before it wastes an API call.
problem: >
  A 15,000-token document goes to a model with a 4,096-token window. No error.
  The response looks plausible. Three days later a QA reviewer finds inconsistencies.
  The model only saw the first third of the input. Silent truncation is the most
  expensive bug in LLM pipelines because it looks like success.
before: |
  # "Probably fine" - counting words as a proxy for tokens
  wc -w system-prompt.txt
  # 1,847 words... is that under 4,096 tokens? Who knows.
after: "cat system-prompt.txt | vrk tok"
group: v1
category: core
example: cat system-prompt.txt | vrk tok --check 8000
flags:
  - flag: --check
    short: ""
    type: int
    description: Pass input through if ≤N tokens; exit 1 with empty stdout if over
  - flag: --model
    short: "-m"
    type: string
    description: "OpenAI model or encoding to count for: gpt-5, gpt-4o, gpt-4, gpt-3.5-turbo, o200k_base (default), cl100k_base"
  - flag: --json
    short: "-j"
    type: bool
    description: Emit JSON (measurement) or JSON error (gate). Does not wrap passthrough.
  - flag: --quiet
    short: "-q"
    type: bool
    description: Suppress stderr on failure
exit_codes:
  - code: 0
    meaning: Measurement success; or --check within limit
  - code: 1
    meaning: --check over limit; I/O error; tokenizer error
  - code: 2
    meaning: Usage error - unknown flag, unknown --model, no stdin, --check without value
meta_title: "vrk tok - Token Counter CLI for LLM Pipelines"
meta_lead: "vrk tok counts the tokens in text and can stop a pipeline when the text is over a budget."
og_title: "vrk tok - token counter and pipeline gate for LLM context budgets"
og_image:
  headline: "Silent truncation looks like success. vrk tok fails loudly."
  code: "cat prompt.txt | vrk tok"
mcp_callable: true
