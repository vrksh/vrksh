name: sse
tagline: SSE stream parser - text/event-stream to JSONL
meta_description: "vrk sse parses Server-Sent Events (text/event-stream) into JSONL records. Use --field to pull out one value, such as streamed LLM text."
meta_lead: "vrk sse parses Server-Sent Event streams into JSONL records, one per event."
og_title: "vrk sse - parse SSE streams into structured JSONL"
description: |
  `vrk sse` parses `text/event-stream` into clean JSONL records. It handles `data:` prefixes, blank-line event delimiters, multi-line data concatenation, and `[DONE]` sentinel detection used by both Anthropic and OpenAI. Use `--field` with a dot-path (arrays as `[0]` or `.0`) to extract one value from the nested JSON, such as a text fragment. Add `--raw` to write each value with no newline, so the streamed text joins back exactly.
problem: >
  A streaming LLM endpoint returns raw Server-Sent Events: `data:` prefixes, blank
  lines as delimiters, `[DONE]` sentinels. `grep '^data:' | sed 's/^data: //'`
  works until a data field spans multiple lines. The sed breaks and the streamed
  response has gaps.
before: |
  curl -sN https://api.example.com/stream | \
    grep '^data: ' | sed 's/^data: //' | grep -v '^\[DONE\]$'
  # breaks on multi-line data fields
  # loses event types and IDs
after: "curl -sN https://api.example.com/stream | vrk sse"
group: v1
category: pipeline
example: "curl -sN $API_URL | vrk sse --field data.delta.text --raw"
flags:
  - flag: --event
    short: "-e"
    type: string
    description: Only emit events of this type
  - flag: --field
    short: "-F"
    type: string
    description: "Extract dot-path field from record as plain text; arrays by index (data.choices[0].text or data.choices.0.text)"
  - flag: --raw
    short: ""
    type: bool
    description: With --field, write each value exactly, with no newline after it
exit_codes:
  - code: 0
    meaning: Success, including clean [DONE] termination
  - code: 1
    meaning: I/O error reading stdin, or --field matched none of the events in a non-empty stream
  - code: 2
    meaning: Usage error - interactive terminal with no piped input, unknown flag
og_image:
  headline: "Parse SSE streams. Get clean JSONL."
  code: "curl -sN https://api.example.com/stream | vrk sse"
mcp_callable: true
