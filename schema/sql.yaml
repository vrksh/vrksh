name: sql
tagline: SQL over CSV files - SQLite in memory, CSV or JSONL out
meta_description: "Run SQL over CSV files from the command line. Joins, GROUP BY and type inference in an in-memory SQLite database. CSV or JSONL out, no database to set up."
meta_lead: "vrk sql loads CSV files into an in-memory SQLite database, one table per file, runs your query and writes the result as CSV or JSONL."
og_title: "vrk sql - SQL over CSV files for AI pipelines"
description: |
  `vrk sql` runs a SQL query over CSV files. Each file becomes a table named after its basename (`users.csv` is `users`), or `name=file.csv` names it, and piped CSV is the table `stdin` (or `-`). Column types are inferred: INTEGER or REAL when every non-empty value is a number (`N/A` and friends load as NULL), TEXT otherwise, so `007` stays `007` and `19.90` stays `19.90`. TSV and other delimiters work with `.tsv` or `--delimiter`. Output is CSV with a header row, or one JSON object per row with `--json`. ATTACH is blocked, so a query can't read or write other files.
problem: >
  Joining two CSVs or filtering one by a numeric column means a Python script,
  a pandas install, or importing into a database by hand. sqlite3's `.import`
  treats every column as text, so `age > 25` compares strings, and it needs a
  database file and several dot-commands before the query runs.
before: |
  sqlite3 :memory: -cmd '.mode csv' -cmd '.import users.csv users' \
    -cmd '.import orders.csv orders' -cmd '.headers on' \
    'SELECT u.name, sum(o.total) FROM users u JOIN orders o ON o.user_id = u.id GROUP BY u.name'
  # every column is TEXT, so numeric comparisons and sorts are wrong
after: "vrk sql 'SELECT u.name, sum(o.total) AS spent FROM users u JOIN orders o ON o.user_id = u.id GROUP BY u.name' users.csv orders.csv"
group: v1
category: pipeline
example: "vrk sql --json 'SELECT * FROM users WHERE age > 25' users.csv | jq -c 'select(.id)'"
flags:
  - flag: --query
    type: string
    description: SQL query; every positional argument is then a CSV file
  - flag: --no-header
    type: bool
    description: Leave the header row out of CSV output
  - flag: --delimiter
    short: "-d"
    type: string
    description: "Input field separator, one character or \\t (default , or tab for .tsv)"
  - flag: --json
    short: "-j"
    type: bool
    description: One JSON object per row, then a metadata trailer
  - flag: --quiet
    short: "-q"
    type: bool
    description: Suppress stderr output
exit_codes:
  - code: 0
    meaning: Success, including empty stdin when the query reads stdin
  - code: 1
    meaning: SQL error, file not found, CSV parse error, empty file, or gzip file
  - code: 2
    meaning: No query, a table but no files, duplicate or invalid table name, stdin with nothing piped, bad --delimiter, or unknown flag
og_image:
  headline: "CSV in, SQL out. No database."
  code: "vrk sql 'SELECT * FROM users' users.csv"
mcp_callable: false
