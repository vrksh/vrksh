name: sql
tagline: SQL over CSV or JSONL - SQLite in memory, CSV or JSONL out
meta_description: "vrk sql runs SQL over CSV or JSONL files in an in-memory SQLite database. It supports joins, GROUP BY, and type inference. Output is CSV or JSONL."
meta_lead: "vrk sql loads CSV files into an in-memory SQLite database, one table per file, runs your query and writes the result as CSV or JSONL."
og_title: "vrk sql - SQL over CSV files for AI pipelines"
description: |
  `vrk sql` runs a SQL query over CSV files in an in-memory SQLite database. Each file becomes a table named after its basename (`users.csv` is `users`). Use `name=file.csv` to choose the table name. Piped CSV is the table `stdin` (or `-`).

  vrk sql infers the column types. A column is INTEGER or REAL when every non-empty value is a number (`N/A` and similar values load as NULL). Otherwise the column is TEXT, so `007` stays `007` and `19.90` stays `19.90`. TSV and other delimiters work with a `.tsv` file name or `--delimiter`.

  JSONL input works too, so you can query the output of other vrk tools. Keys become columns, `true` and `false` become 1 and 0, nested values stay JSON text for `json_extract`, and `{"_vrk":...}` trailers are skipped.

  The output is CSV with a header row, or one JSON object per row with `--json`. ATTACH is blocked, so a query cannot read or write other files.
problem: >
  Joining two CSVs or filtering one by a numeric column means a Python script,
  a pandas install, or importing into a database by hand. sqlite3's `.import`
  treats every column as text, so `age > 25` compares strings, and it needs a
  database file and several dot-commands before the query runs.
before: |
  sqlite3 :memory: -cmd '.mode csv' -cmd '.import users.csv users' \
    -cmd '.import orders.csv orders' -cmd '.headers on' \
    'SELECT u.name, sum(o.total) FROM users u JOIN orders o ON o.user_id = u.id GROUP BY u.name'
  # every column is TEXT, so numeric comparisons and sorts are wrong
after: "vrk sql 'SELECT u.name, sum(o.total) AS spent FROM users u JOIN orders o ON o.user_id = u.id GROUP BY u.name' users.csv orders.csv"
group: v1
category: pipeline
example: "vrk sql --json 'SELECT * FROM users WHERE age > 25' users.csv | jq -c 'select(.id)'"
flags:
  - flag: --query
    type: string
    description: SQL query; every positional argument is then a CSV file
  - flag: --no-header
    type: bool
    description: Leave the header row out of CSV output
  - flag: --delimiter
    short: "-d"
    type: string
    description: "Input field separator, one character or \\t (default , or tab for .tsv)"
  - flag: --json
    short: "-j"
    type: bool
    description: One JSON object per row, then a metadata trailer
  - flag: --quiet
    short: "-q"
    type: bool
    description: Suppress stderr output
  - flag: --timeout
    type: duration
    description: Stop and exit 1 if loading and the query take longer, e.g. 30s (default none)
exit_codes:
  - code: 0
    meaning: Success, including empty stdin when the query reads stdin
  - code: 1
    meaning: SQL error, file not found, CSV parse error, empty file, gzip file, or --timeout reached
  - code: 2
    meaning: No query, a table but no files, duplicate or invalid table name, stdin with nothing piped, bad --delimiter, negative --timeout, or unknown flag
og_image:
  headline: "CSV in, SQL out. No database."
  code: "vrk sql 'SELECT * FROM users' users.csv"
mcp_callable: false
