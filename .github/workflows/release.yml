name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create GitHub releases and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install.sh fallback matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^FALLBACK_VERSION="\(.*\)"/\1/p' hugo/static/install.sh)"
          if [ "$want" != "$have" ]; then
            echo "FALLBACK_VERSION in hugo/static/install.sh is '$have', tag is '$want'. Bump it and re-tag." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
